name: Deploy LIVE - axis-day-off

# Release model (owner decision 2026-07-14, incident-verified — see
# .claude/skills/monday-cicd/references/pipeline-model.md §4b + known-issues):
# every app keeps TWO standing versions with stable ids — the latest draft
# (develop → deploy-draft) and the LIVE version (this workflow). Version
# promotes are BANNED as a release mechanism (id churn needs maintenance and
# lands badly in customer accounts); a promote is a rare, deliberate,
# documented event (e.g. new scopes), never a routine release.
#
# `code:push --force -a <app>` is NOT reliable for live: despite the CLI help
# text, it resolves the app's LATEST version (usually the draft) — verified
# from the only two live runs ever executed. So this workflow resolves the
# LIVE version id at run time and pushes pinned with -i.
#
# main's protection is process-only (private repo on GitHub Free plan):
# release freeze + immediate main-back-merge keep main == source of truth
# for live. If the app has no live version yet, the resolve step fails
# loudly — first-ever go-live is a deliberate one-time promote, not this
# workflow.

on:
  push:
    branches:
      - main
    paths:
      - "apps/axis/day-off/**"
      - "packages/shared/**"
      - "packages/error-kit/**"
      - "apps/axis/services/**"

jobs:
  deploy-live:
    name: "🚨 FORCE DEPLOY axis-day-off TO LIVE 🚨"
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-live-axis-day-off
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build axis-day-off
        # Version layer: stamp the exact commit + release flag into the bundle.
        # Bake the Axiom activation gate into the bundle (error-guard remote-monitoring
        # standard). Only the ingest token is a secret; dataset/app are literals. When
        # the secret is unset the gate stays inert (fail-soft) — nothing ships.
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_IS_RELEASE: "true"
          VITE_AXIOM_DATASET: app-errors
          VITE_AXIOM_TOKEN: ${{ secrets.AXIOM_INGEST_TOKEN }}
          VITE_AXIOM_APP: day-off
        run: pnpm --filter "./apps/axis/day-off" build

      # Sourcemaps ('hidden' in vite.config.ts) power stack symbolication but must
      # NEVER reach the CDN — archive them keyed by commit SHA, then strip them
      # from the deploy dir before code:push. Pull with:
      #   .claude/skills/axiom-sre/scripts/symbolicate '<frame>' --app day-off --ver <x.y.z+sha>
      - name: Archive sourcemaps as build artifact (for stack symbolication)
        uses: actions/upload-artifact@v4
        with:
          name: sourcemaps-day-off-${{ github.sha }}
          path: apps/axis/day-off/dist/**/*.map
          retention-days: 90
          if-no-files-found: warn

      - name: Strip sourcemaps before deploy (never ship .map to the CDN)
        run: |
          set -euo pipefail
          find apps/axis/day-off/dist -name '*.map' -type f -delete
          remaining="$(find apps/axis/day-off/dist -name '*.map' -type f | wc -l | tr -d ' ')"
          echo "remaining .map files in deploy dir: $remaining"
          if [ "$remaining" != "0" ]; then
            echo "::error::sourcemaps still present in deploy dir — refusing to push (would leak source to the CDN)"
            exit 1
          fi

      - name: Install monday.com apps CLI
        run: npm install -g @mondaycom/apps-cli

      - name: Authenticate mapps CLI (non-interactive)
        run: mapps init -t "$MONDAY_TOKEN"
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}

      - name: Resolve LIVE version id (pin the target)
        id: live
        run: |
          set -euo pipefail
          LIVE_ID="$(mapps app-version:list -i "$APP_ID" 2>/dev/null \
            | awk -F'│' '$7 ~ /live/ { gsub(/[^0-9]/, "", $3); print $3; exit }')"
          if [ -z "$LIVE_ID" ]; then
            echo "::error::app $APP_ID has no LIVE version — first go-live is a deliberate promote (see pipeline-model.md §4b); this workflow only refreshes an existing live version."
            exit 1
          fi
          echo "Resolved LIVE version id: $LIVE_ID"
          echo "live_id=$LIVE_ID" >> "$GITHUB_OUTPUT"
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}
          APP_ID: ${{ secrets.APP_AXIS_DAY_OFF_ID }}

      - name: "🚨 FORCE push to LIVE version (pinned id) 🚨"
        run: >
          mapps code:push -c --force
          -d apps/axis/day-off/dist
          -i "${{ steps.live.outputs.live_id }}"
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}
