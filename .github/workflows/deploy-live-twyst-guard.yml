name: Deploy LIVE - twyst-guard

# round322: the twyst-your-status GUARD server (monday-code component of the
# SAME app). Spec section 7.2: merges into main auto-deploy to the app's
# LATEST LIVE version via --force. This rebuilds from main and pushes straight
# to production — there is no promote-the-tested-draft step.

on:
  push:
    branches:
      - main
    paths:
      - "apps/twyst-your-status/server/**"
      - "apps/twyst-your-status/src/domain/**"   # bundled INTO the guard — a rules change redeploys it

jobs:
  deploy-live:
    name: "🚨 FORCE DEPLOY twyst-guard TO LIVE 🚨"
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-live-twyst-guard
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle the guard (inlines the client domain modules)
        run: pnpm --filter "./apps/twyst-your-status/server" build

      - name: Install monday.com apps CLI
        run: npm install -g @mondaycom/apps-cli

      - name: Authenticate mapps CLI (non-interactive)
        run: mapps init -t "$MONDAY_TOKEN"
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}

      # Server-side push: no -c flag; --force targets the latest LIVE version.
      # --verbose is LOAD-BEARING (mapps cli.md): a failed server push is
      # otherwise silent.
      - name: 🚨 FORCE push to LIVE version 🚨
        run: >
          mapps code:push
          -d apps/twyst-your-status/server
          -a "$APP_ID"
          --force
          --verbose
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}
          APP_ID: ${{ secrets.APP_TWYST_YOUR_STATUS_ID }}
