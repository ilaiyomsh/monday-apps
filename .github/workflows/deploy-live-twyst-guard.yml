name: Deploy LIVE - twyst-guard

# round322: the twyst-your-status GUARD server (monday-code component of the
# SAME app). Spec section 7.2: merges into main auto-deploy to the app's
# LATEST LIVE version via --force. This rebuilds from main and pushes straight
# to production — there is no promote-the-tested-draft step.

on:
  push:
    branches:
      - main
    paths:
      - "apps/twyst-your-status/server/**"
      - "apps/twyst-your-status/src/domain/**"   # bundled INTO the guard — a rules change redeploys it

jobs:
  deploy-live:
    name: "🚨 FORCE DEPLOY twyst-guard TO LIVE 🚨"
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-live-twyst-guard
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle the guard (inlines the client domain modules)
        run: pnpm --filter "./apps/twyst-your-status/server" build

      - name: Install monday.com apps CLI
        run: npm install -g @mondaycom/apps-cli

      # Same App ID as the client — twyst-your-status uses a per-app token
      # secret, so the guard must authenticate with the same one (the generic
      # MONDAY_TOKEN is a different account and cannot reach this app).
      - name: Authenticate mapps CLI (non-interactive)
        run: mapps init -t "$MONDAY_TOKEN"
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN_TWYST_YOUR_STATUS }}

      # PIN the live version. `code:push -a` (with or without --force) resolves
      # the LATEST version — in the normal two-version layout that is the DRAFT,
      # so `--force -a` would silently refresh the draft and leave production
      # untouched (pipeline-model.md §4). Resolve the live id and push with -i,
      # exactly as the client live workflow does.
      - name: Resolve LIVE version id (pin the target)
        id: live
        run: |
          set -euo pipefail
          LIVE_ID="$(mapps app-version:list -i "$APP_ID" 2>/dev/null \
            | awk -F'│' '$7 ~ /live/ { gsub(/[^0-9]/, "", $3); print $3; exit }')"
          if [ -z "$LIVE_ID" ]; then
            echo "::error::app $APP_ID has no LIVE version — first go-live is a deliberate promote (pipeline-model.md §4b); this workflow only refreshes an existing live version."
            exit 1
          fi
          echo "Resolved LIVE version id: $LIVE_ID"
          echo "live_id=$LIVE_ID" >> "$GITHUB_OUTPUT"
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN_TWYST_YOUR_STATUS }}
          APP_ID: ${{ secrets.APP_TWYST_YOUR_STATUS_ID }}

      # Server-side push: no -c flag; --force refreshes the PINNED live version.
      # --verbose is LOAD-BEARING (mapps cli.md): a failed server push is
      # otherwise silent.
      - name: "🚨 FORCE push to LIVE version (pinned id) 🚨"
        run: >
          mapps code:push
          -d apps/twyst-your-status/server
          -i "${{ steps.live.outputs.live_id }}"
          --force
          --verbose
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN_TWYST_YOUR_STATUS }}
          APP_ID: ${{ secrets.APP_TWYST_YOUR_STATUS_ID }}
