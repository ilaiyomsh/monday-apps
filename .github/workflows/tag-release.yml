name: Tag and release

# Version layer (docs/monday-cicd-spec.md, 2026-07-14): after every merge to
# main, tag each app whose version changed (<slug>@<version>) and create a
# GitHub release record pointing at its changelog. Creating a tag is not a
# commit to the branch — no conflict with the no-direct-push rule.
#
# HEAD^ is the first parent of the merge commit = the previous main tip
# (the repo releases develop->main via merge commits — hybrid decision
# 2026-07-14), so old-vs-new version comparison is exact.

on:
  push:
    branches: [main]

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (full history for tag push + parent comparison)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag bumped apps and create release records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source scripts/apps.sh
          for slug in "${APP_SLUGS[@]}"; do
            path="$(app_path "$slug")"
            old=$(git show "HEAD^:$path/package.json" 2>/dev/null | jq -r .version || echo "")
            new=$(jq -r .version "$path/package.json")

            # An app ABSENT from the previous main tip is having its FIRST release, and
            # `old` reads empty. The guard here used to be
            #   [ -n "$old" ] && [ "$old" != "$new" ]
            # whose first half silently filtered that case out — so the one release that
            # most deserves a marker was the only kind that never got one. It is not
            # hypothetical: twyst-your-status 3.6.0 went live on 2026-07-28 untagged and
            # with no release record, and had to be tagged by hand afterwards. Same
            # root cause as the release-guard.sh gap fixed in the same release: "app was
            # not on main before" was simply never a considered state.
            if [ -z "$old" ] || [ "$old" = "null" ]; then
              # A version we cannot read is not a version we can tag.
              if [ -z "$new" ] || [ "$new" = "null" ]; then
                echo "::warning::$slug: first release but no readable version — not tagging"
                continue
              fi
              span="first release — $new"
            elif [ "$old" != "$new" ]; then
              span="$old -> $new"
            else
              continue
            fi

            tag="$slug@$new"
            if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
              echo "::warning::tag $tag already exists — skipping"
              continue
            fi
            git tag "$tag"
            git push origin "$tag"
            # Release notes = the exact commits belonging to this jump
            # (owner requirement 2026-07-14: every jump maps to its commits,
            # with zero discipline needed). HEAD^..HEAD on the release merge
            # = everything this release brought; filtered to the app's paths.
            notes="$(mktemp)"
            {
              echo "## Commits in $span"
              git log --format='- %h %s' "HEAD^..HEAD" -- "$path" "${SHARED_PATHS[@]}"
              echo ""
              echo "Story: [\`$path/CHANGELOG.md\`](../../blob/main/$path/CHANGELOG.md)"
            } > "$notes"
            gh release create "$tag" \
              --title "$slug v$new" \
              --notes-file "$notes" || \
              echo "::warning::release record for $tag failed (tag itself was pushed)"
            echo "tagged $tag ($span)"
          done
