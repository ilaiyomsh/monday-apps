name: Print scale-seed artifact (read-only)

# Utility: the agent-proxy in cloud sessions blocks Azure blob storage, so
# artifacts can't be downloaded directly there. This dispatch-only workflow
# fetches the wz-scale-state artifact from a given run and prints its JSON
# files into the job log (which IS readable via the API). Touches nothing.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Workflow run id that produced the wz-scale-state artifact"
        required: true

jobs:
  print:
    name: Print artifact files to log
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: wz-scale-state
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Print JSON files
        run: |
          for f in *.json; do
            echo "=====BEGIN $f====="
            cat "$f"
            echo ""
            echo "=====END $f====="
          done
