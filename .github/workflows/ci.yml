name: CI

# Gate 1 (spec section 5): runs on every PR into develop or main.
# Blocks merge on failure. Type-check is tolerant of JS-only apps that have
# no type-check script — "--if-present" makes it a no-op for those instead
# of a failure.

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  # Version guards (docs/monday-cicd-spec.md, version layer 2026-07-14).
  # Enforcement honesty: GitHub Free + private repo = no required checks, so a
  # red guard reports but does not physically block. Discipline + the agent
  # are the enforcement layer (owner decision 2026-07-07).
  guards:
    name: version guards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history — guards compare both permanent branches)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corridor guard (PRs into develop)
        if: github.base_ref == 'develop'
        env:
          HAS_SHARED_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'shared-change') }}
          # Flip to "on" if/when the corridor model is adopted (deferred 2026-07-14).
          CORRIDOR_MODE: "off"
        run: bash scripts/corridor-guard.sh

      - name: Release guard (PRs into main)
        if: github.base_ref == 'main'
        run: bash scripts/release-guard.sh

  ci:
    name: type-check, lint, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Error-wiring audit (blocking): every client surface wires the global handlers +
      # Axiom sink before render and has a root boundary; every server has process guards,
      # a terminal error middleware, and an opts-injected sink. Structural, node:fs only.
      # The audit's own structure reader is unit-tested (node:test, stdlib — the audit and its
      # lib stay dependency-free). Runs FIRST: a broken parser would make the gate below
      # report green on a workflow it can no longer read correctly.
      - name: Audit lib unit tests
        # Explicit glob, not a directory: `node --test <dir>` does not resolve a bare
        # directory the same way across Node majors, and a silent 0-test pass is worthless.
        run: node --test scripts/lib/*.test.mjs

      - name: Error-wiring audit
        run: node scripts/error-wiring-audit.mjs

      # Forbidden-import guard: nothing on a surface's EAGER (non-lazy) module graph may
      # import a heavy UI kit. Deliberately an invariant, not a byte budget — a threshold
      # measures a symptom, needs the build to evaluate, and only ever ratchets upward.
      # Static imports only, and it stops at import() by design (that is how a heavy
      # dependency is supposed to be reached). Runs before the build; costs milliseconds.
      - name: Eager-import audit
        run: node scripts/lib/eager-graph.mjs

      - name: Type-check (skips packages with no type-check script)
        run: pnpm -r --if-present run type-check

      - name: Lint (skips packages with no lint script)
        run: pnpm -r --if-present run lint

      - name: Build (skips packages with no build script)
        run: pnpm -r --if-present run build

      # error-kit's own suite is BLOCKING (unlike the whole-workspace test job below, which is
      # visibility-only): it carries the drift tests that guarantee the vendored server/SPA
      # copies never diverge from the canonical shipping stack. Cheap — one package.
      - name: error-kit tests + drift (blocking)
        run: pnpm --filter @mapps/error-kit test

  # amp4email document validation (deadline-confirm). Gmail answers a dynamic
  # part it refuses with `INTERNAL_ERROR` — a documented catch-all with no
  # content — so an invalid document and a rejected envelope are
  # indistinguishable from the inbox. The official validator names the rule and
  # the line, which is the only way to tell them apart before sending.
  #
  # The exit code is the contract (see apps/deadline-confirm/scripts/validate-amp.mjs):
  #   1 = a document is INVALID → a real defect, this job FAILS.
  #   3 = the validator itself could not be fetched (it loads from
  #       cdn.ampproject.org) → nothing was assessed. Reported, never fatal:
  #       failing here would couple every PR in the monorepo to an external CDN.
  # Separate job so a CDN outage cannot stall the blocking type-check/lint/build.
  amp4email:
    name: amp4email document validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Invoked as plain `node`, NOT through a package-manager runner: the exit
      # code must arrive unmodified for the 1-vs-3 distinction to survive.
      - name: Validate rendered amp4email documents
        run: |
          set +e
          node apps/deadline-confirm/scripts/validate-amp.mjs
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "✅ Every rendered amp4email sample is valid." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$code" -eq 3 ]; then
            echo "⚠️ SKIPPED — the AMP validator could not be fetched from cdn.ampproject.org." >> "$GITHUB_STEP_SUMMARY"
            echo "Nothing was validated; this is infrastructure, not a verdict on the documents." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "❌ A rendered amp4email document is INVALID (read the log above for rule + line)." >> "$GITHUB_STEP_SUMMARY"
          echo "Gmail would answer this with an opaque INTERNAL_ERROR, so do not ship it." >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

  # Visibility-only test job (owner decision 2026-07-12): runs the full
  # workspace test suites and reports the outcome in the job summary, but
  # never fails the check — tracker carries 2 known-red deferred tests
  # (FOLLOW-UPS F1) and enforcement stays with the test-guard hooks.
  # Promote to blocking once the known-red baseline is cleared.
  tests:
    name: tests (non-blocking visibility)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests (never fails the check)
        id: run_tests
        continue-on-error: true
        run: pnpm -r --if-present run test

      - name: Report outcome in job summary
        run: |
          if [ "${{ steps.run_tests.outcome }}" = "success" ]; then
            echo "✅ All workspace test suites passed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Some tests FAILED (non-blocking — read the 'Run tests' log above)." >> "$GITHUB_STEP_SUMMARY"
            echo "Known-red baseline: tracker has 2 deferred failing tests (apps/axis/docs/FOLLOW-UPS.md F1)." >> "$GITHUB_STEP_SUMMARY"
            echo "Any OTHER failure is yours to investigate before merging." >> "$GITHUB_STEP_SUMMARY"
          fi
