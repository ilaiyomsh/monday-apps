name: Deploy LIVE - telemetry-dashboard

# Spec section 7.2: merges into main force-deploy to the app's LATEST LIVE
# version. main is protected (PR + approval + status checks), so this only ever
# runs after a reviewed, approved merge — never on a direct push.
#
# Server-side (monday-code) app: `mapps code:push` WITHOUT -c.
#
# NOTE: cannot succeed until the monday app exists, has a LIVE version, and
# secrets.APP_TELEMETRY_DASHBOARD_ID is added — see the app README.

on:
  push:
    branches:
      - main
    paths:
      - "apps/telemetry-dashboard/**"
      - "packages/shared/**"

jobs:
  deploy-live:
    name: "🚨 FORCE DEPLOY telemetry-dashboard TO LIVE 🚨"
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-live-telemetry-dashboard
      cancel-in-progress: false
    # The mapps steps skip (job stays green) until the App ID secret is added.
    env:
      APP_ID: ${{ secrets.APP_TELEMETRY_DASHBOARD_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build telemetry-dashboard (client)
        run: pnpm --filter "./apps/telemetry-dashboard" build

      - name: Install monday.com apps CLI
        if: ${{ env.APP_ID != '' }}
        run: npm install -g @mondaycom/apps-cli

      - name: Authenticate mapps CLI (non-interactive)
        if: ${{ env.APP_ID != '' }}
        run: mapps init -t "$MONDAY_TOKEN"
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}

      # `code:push --force -a <app>` resolves the NEWEST version (the draft above
      # live), not live — incident-verified 2026-07-15. Resolve the LIVE version
      # id and push pinned with -i.
      - name: Resolve LIVE version id (pin the target)
        id: live
        if: ${{ env.APP_ID != '' }}
        run: |
          set -euo pipefail
          LIVE_ID="$(mapps app-version:list -i "$APP_ID" 2>/dev/null \
            | awk -F'│' '$7 ~ /live/ { gsub(/[^0-9]/, "", $3); print $3; exit }')"
          if [ -z "$LIVE_ID" ]; then
            echo "::error::app $APP_ID has no LIVE version — first go-live is a deliberate promote; this workflow only refreshes an existing live version."
            exit 1
          fi
          echo "Resolved LIVE version id: $LIVE_ID"
          echo "live_id=$LIVE_ID" >> "$GITHUB_OUTPUT"
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}
          APP_ID: ${{ secrets.APP_TELEMETRY_DASHBOARD_ID }}

      # Server app: no -c, ships the app root. Retry once on the transient
      # remote-server error.
      - name: "🚨 FORCE push to LIVE version (pinned id) 🚨"
        if: ${{ env.APP_ID != '' }}
        run: |
          set -uo pipefail
          for attempt in 1 2; do
            if mapps code:push --force \
                 -d apps/telemetry-dashboard \
                 -i "${{ steps.live.outputs.live_id }}"; then
              exit 0
            fi
            echo "push attempt $attempt failed; retrying once in 15s (transient remote error)…"
            sleep 15
          done
          echo "::error::code:push to live version ${{ steps.live.outputs.live_id }} failed after retry"
          exit 1
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}
