name: Deploy LIVE - axis-sync-calender

# Spec section 7.2: merges into main auto-deploy to the app's LATEST LIVE
# version via --force. This rebuilds from main and pushes straight to
# production — there is no promote-the-tested-draft step. Correctness is
# guaranteed only by the release-freeze rule (nothing merges into develop
# while a develop->main PR is open), not by artifact identity.
#
# main is protected (Gate 2: PR + 1 approval + required status checks +
# no bypass, including admins) so this workflow only ever runs after a
# reviewed, approved merge — never on a direct push.
#
# When instantiating this template for a real app, rename the file to:
#   deploy-live-axis-sync-calender.yml
# and replace all axis-sync-calender / . / APP_AXIS_SYNC_CALENDER_ID placeholders.

on:
  push:
    branches:
      - main
    paths:
      - "apps/axis/sync-calender/**"
      - "packages/shared/**"
      - "apps/axis/services/**"

jobs:
  deploy-live:
    name: "🚨 FORCE DEPLOY axis-sync-calender TO LIVE 🚨"
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-live-axis-sync-calender
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build axis-sync-calender
        run: pnpm --filter "./apps/axis/sync-calender" build

      - name: Install monday.com apps CLI
        run: npm install -g @mondaycom/apps-cli

      - name: Authenticate mapps CLI (non-interactive)
        run: mapps init -t "$MONDAY_TOKEN"
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}

      #  is "-c" for client-side (CDN) apps, empty for
      # server-side (monday-code) apps — the only difference between the two.
      - name: "🚨 FORCE push to latest LIVE version 🚨"
        run: >
          mapps code:push  --force
          -d apps/axis/sync-calender/.
          -a "$APP_ID"
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}
          APP_ID: ${{ secrets.APP_AXIS_SYNC_CALENDER_ID }}
