name: Deploy Draft - axis-tracker

# Spec section 7.1: merges into develop auto-deploy to the app's LATEST
# DRAFT version. No version IDs are stored anywhere — only the App ID
# secret; the CLI resolves the latest draft itself.
#
# When instantiating this template for a real app, rename the file to:
#   deploy-draft-axis-tracker.yml
# and replace all axis-tracker / build / APP_AXIS_TRACKER_ID placeholders.

on:
  workflow_dispatch: {}   # manual re-deploy of the draft (e.g. dev-live detach); draft only — live stays merge-triggered
  push:
    branches:
      - develop
    paths:
      - "apps/axis/tracker/**"
      - "packages/shared/**"
      - "apps/axis/services/**"

jobs:
  deploy-draft:
    name: Build and push axis-tracker to draft
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-draft-axis-tracker
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build axis-tracker
        run: pnpm --filter "./apps/axis/tracker" build
        # Bake the Axiom activation gate into the bundle (error-guard remote-monitoring
        # standard). Only the ingest token is a secret; dataset/app are literals. When
        # the secret is unset the gate stays inert (fail-soft) — nothing ships.
        env:
          VITE_AXIOM_DATASET: app-errors
          VITE_AXIOM_TOKEN: ${{ secrets.AXIOM_INGEST_TOKEN }}
          VITE_AXIOM_APP: tracker

      - name: Install monday.com apps CLI
        run: npm install -g @mondaycom/apps-cli

      - name: Authenticate mapps CLI (non-interactive)
        run: mapps init -t "$MONDAY_TOKEN"
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}

      # -c is "-c" for client-side (CDN) apps, empty for
      # server-side (monday-code) apps — the only difference between the two.
      - name: Push to latest DRAFT version
        run: >
          mapps code:push -c
          -d apps/axis/tracker/build
          -a "$APP_ID"
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}
          APP_ID: ${{ secrets.APP_AXIS_TRACKER_ID }}
