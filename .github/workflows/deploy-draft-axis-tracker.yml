name: Deploy Draft - axis-tracker

# Spec section 7.1: merges into develop auto-deploy to the app's LATEST
# DRAFT version. No version IDs are stored anywhere — only the App ID
# secret; the CLI resolves the latest draft itself.
#
# When instantiating this template for a real app, rename the file to:
#   deploy-draft-axis-tracker.yml
# and replace all axis-tracker / build / APP_AXIS_TRACKER_ID placeholders.

on:
  workflow_dispatch: {}   # manual re-deploy of the draft (e.g. dev-live detach); draft only — live stays merge-triggered
  push:
    branches:
      - develop
    paths:
      - "apps/axis/tracker/**"
      - "packages/shared/**"
      - "apps/axis/services/**"

jobs:
  deploy-draft:
    name: Build and push axis-tracker to draft
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-draft-axis-tracker
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build axis-tracker
        # Version layer: stamp the exact commit into the bundle (__BUILD_SHA__).
        # Bake the Axiom activation gate into the bundle (error-guard remote-monitoring
        # standard). Only the ingest token is a secret; dataset/app are literals. When
        # the secret is unset the gate stays inert (fail-soft) — nothing ships.
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_AXIOM_DATASET: app-errors
          VITE_AXIOM_TOKEN: ${{ secrets.AXIOM_INGEST_TOKEN }}
          VITE_AXIOM_APP: tracker
        run: pnpm --filter "./apps/axis/tracker" build

      # Sourcemaps ('hidden' in vite.config.js) power stack symbolication but must
      # NEVER reach the CDN — archive them keyed by commit SHA, then strip them
      # from the deploy dir before code:push. Pull with:
      #   .claude/skills/axiom-sre/scripts/symbolicate '<frame>' --app tracker --ver <x.y.z+sha>
      - name: Archive sourcemaps as build artifact (for stack symbolication)
        uses: actions/upload-artifact@v4
        with:
          name: sourcemaps-tracker-${{ github.sha }}
          path: apps/axis/tracker/build/**/*.map
          retention-days: 90
          if-no-files-found: warn

      - name: Strip sourcemaps before deploy (never ship .map to the CDN)
        run: |
          set -euo pipefail
          find apps/axis/tracker/build -name '*.map' -type f -delete
          remaining="$(find apps/axis/tracker/build -name '*.map' -type f | wc -l | tr -d ' ')"
          echo "remaining .map files in deploy dir: $remaining"
          if [ "$remaining" != "0" ]; then
            echo "::error::sourcemaps still present in deploy dir — refusing to push (would leak source to the CDN)"
            exit 1
          fi

      - name: Install monday.com apps CLI
        run: npm install -g @mondaycom/apps-cli

      - name: Authenticate mapps CLI (non-interactive)
        run: mapps init -t "$MONDAY_TOKEN"
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}

      # -c is "-c" for client-side (CDN) apps, empty for
      # server-side (monday-code) apps — the only difference between the two.
      - name: Push to latest DRAFT version
        run: >
          mapps code:push -c
          -d apps/axis/tracker/build
          -a "$APP_ID"
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}
          APP_ID: ${{ secrets.APP_AXIS_TRACKER_ID }}
