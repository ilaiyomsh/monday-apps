name: Deploy Draft - deadline-confirm

# Spec section 7.1: merges into develop auto-deploy to the app's LATEST
# DRAFT version. No version IDs are stored anywhere — only the App ID
# secret; the CLI resolves the latest draft itself.
#
# When instantiating this template for a real app, rename the file to:
#   deploy-draft-deadline-confirm.yml
# and replace all deadline-confirm / . / APP_DEADLINE_CONFIRM_ID placeholders.

on:
  workflow_dispatch: {}   # manual re-deploy of the draft (e.g. dev-live detach); draft only — live stays merge-triggered
  push:
    branches:
      - develop
    paths:
      - "apps/deadline-confirm/**"
      - "packages/shared/**"

jobs:
  deploy-draft:
    name: Build and push deadline-confirm to draft
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-draft-deadline-confirm
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build deadline-confirm
        # Version layer: stamp the exact commit into the bundle (__BUILD_SHA__).
        # Without it vite.config.ts falls back to 'local' and the admin's version
        # line reads "0.12.0 · local" on EVERY deploy — indistinguishable from a
        # dev build and useless for telling which commit is live (cost a round of
        # confusion 2026-08-04). It is also what keys Axiom symbolication.
        # Axiom activation gate (error-guard remote-monitoring): the ingest token is the
        # only secret; dataset/app are literals; inert/fail-soft when the secret is unset.
        # Wires the client admin SPA's browser sink (src/client/admin/utils/axiomErrorSink.ts).
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_AXIOM_DATASET: app-errors
          VITE_AXIOM_TOKEN: ${{ secrets.AXIOM_INGEST_TOKEN }}
          VITE_AXIOM_APP: deadline-confirm-admin
        run: pnpm --filter "./apps/deadline-confirm" build

      # The admin CLIENT bundle ('hidden' sourcemaps) is served to browsers, so its
      # maps must NEVER reach the deploy — archive them keyed by commit SHA, then
      # strip them from public/admin before code:push. (Server runs from source and
      # is already readable — not symbolicated.) Pull with:
      #   .claude/skills/axiom-sre/scripts/symbolicate '<frame>' --app deadline-confirm --ver <x.y.z+sha>
      - name: Archive client sourcemaps as build artifact (for stack symbolication)
        uses: actions/upload-artifact@v4
        with:
          name: sourcemaps-deadline-confirm-${{ github.sha }}
          path: apps/deadline-confirm/public/admin/**/*.map
          retention-days: 90
          if-no-files-found: warn

      - name: Strip client sourcemaps before deploy (never ship .map to the browser)
        run: |
          set -euo pipefail
          find apps/deadline-confirm/public/admin -name '*.map' -type f -delete
          remaining="$(find apps/deadline-confirm/public/admin -name '*.map' -type f | wc -l | tr -d ' ')"
          echo "remaining client .map files: $remaining"
          if [ "$remaining" != "0" ]; then
            echo "::error::client sourcemaps still present — refusing to push (would leak source)"
            exit 1
          fi

      - name: Install monday.com apps CLI
        run: npm install -g @mondaycom/apps-cli

      - name: Authenticate mapps CLI (non-interactive)
        run: mapps init -t "$MONDAY_TOKEN"
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}

      #  is "-c" for client-side (CDN) apps, empty for
      # server-side (monday-code) apps — the only difference between the two.
      - name: Push to latest DRAFT version
        # --verbose: mapps swallows task errors (logger.debug only) — without it
        # a failed push exits 1 with no reason printed (incident 2026-07-14).
        run: >
          mapps code:push --verbose
          -d apps/deadline-confirm/.
          -a "$APP_ID"
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}
          APP_ID: ${{ secrets.APP_DEADLINE_CONFIRM_ID }}
