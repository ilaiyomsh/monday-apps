name: Deploy Draft - discussions

# Spec section 7.1: merges into develop auto-deploy to the app's LATEST
# DRAFT version. No version IDs are stored anywhere — only the App ID
# secret; the CLI resolves the latest draft itself.
#
# When instantiating this template for a real app, rename the file to:
#   deploy-draft-discussions.yml
# and replace all discussions / build / APP_DISCUSSIONS_ID placeholders.

on:
  workflow_dispatch: {}   # manual re-deploy of the draft (e.g. dev-live detach)
  push:
    branches:
      - develop
    paths:
      - "apps/discussions/**"
      - "packages/shared/**"
      - "packages/error-kit/**"

jobs:
  deploy-draft:
    name: Build and push discussions to draft
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-draft-discussions
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build discussions
        # Version layer: stamp the exact commit into the bundle (__BUILD_SHA__).
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
          # Axiom activation gate (error-guard remote-monitoring): the ingest token is the
          # only secret; dataset/app are literals; inert/fail-soft when the secret is unset.
          VITE_AXIOM_DATASET: app-errors
          VITE_AXIOM_TOKEN: ${{ secrets.AXIOM_INGEST_TOKEN }}
          VITE_AXIOM_APP: discussions
        run: pnpm --filter "./apps/discussions" build

      - name: Install monday.com apps CLI
        run: npm install -g @mondaycom/apps-cli

      - name: Authenticate mapps CLI (non-interactive)
        run: mapps init -t "$MONDAY_TOKEN"
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}

      - name: Push to latest DRAFT version
        run: >
          mapps code:push -c
          -d apps/discussions/build
          -a "$APP_ID"
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}
          APP_ID: ${{ secrets.APP_DISCUSSIONS_ID }}
