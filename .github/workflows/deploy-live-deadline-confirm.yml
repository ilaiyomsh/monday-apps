name: Deploy LIVE - deadline-confirm

# Release model (owner decision 2026-07-14, incident-verified — see
# .claude/skills/monday-cicd/references/pipeline-model.md §4b):
# every app keeps TWO standing versions with stable ids — the latest draft
# (develop → deploy-draft) and the LIVE version (this workflow). Version
# promotes are BANNED as a routine release mechanism (id churn needs
# maintenance and lands badly in customer accounts); a promote is a rare,
# deliberate, documented event (e.g. new scopes), never a routine release.
#
# `code:push --force -a <app>` is NOT reliable for live: despite the CLI help
# text, it resolves the app's LATEST version (usually the newer draft that
# sits above live) — verified on deadline-confirm 2026-07-15, where a bare
# `--force` push landed on the v3 DRAFT and left the live version on v2. So
# this workflow resolves the LIVE version id at run time and pushes pinned
# with -i, exactly like the other apps' live workflows.
#
# deadline-confirm is a SERVER (monday-code) app: the push has NO -c flag and
# ships the app root (-d apps/deadline-confirm/.).
#
# main is protected (Gate 2: PR + 1 approval + required status checks) so this
# workflow only ever runs after a reviewed, approved merge — never on a direct
# push. If the app has no live version yet, the resolve step fails loudly:
# first-ever go-live is a deliberate one-time promote, not this workflow.

on:
  push:
    branches:
      - main
    paths:
      - "apps/deadline-confirm/**"
      - "packages/shared/**"

jobs:
  deploy-live:
    name: "🚨 FORCE DEPLOY deadline-confirm TO LIVE 🚨"
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-live-deadline-confirm
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build deadline-confirm
        run: pnpm --filter "./apps/deadline-confirm" build

      - name: Install monday.com apps CLI
        run: npm install -g @mondaycom/apps-cli

      - name: Authenticate mapps CLI (non-interactive)
        run: mapps init -t "$MONDAY_TOKEN"
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}

      - name: Resolve LIVE version id (pin the target)
        id: live
        run: |
          set -euo pipefail
          LIVE_ID="$(mapps app-version:list -i "$APP_ID" 2>/dev/null \
            | awk -F'│' '$7 ~ /live/ { gsub(/[^0-9]/, "", $3); print $3; exit }')"
          if [ -z "$LIVE_ID" ]; then
            echo "::error::app $APP_ID has no LIVE version — first go-live is a deliberate promote (see pipeline-model.md §4b); this workflow only refreshes an existing live version."
            exit 1
          fi
          echo "Resolved LIVE version id: $LIVE_ID"
          echo "live_id=$LIVE_ID" >> "$GITHUB_OUTPUT"
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}
          APP_ID: ${{ secrets.APP_DEADLINE_CONFIRM_ID }}

      - name: "🚨 FORCE push to LIVE version (pinned id) 🚨"
        # Server app: no -c, ship the app root.
        run: >
          mapps code:push --force
          -d apps/deadline-confirm/.
          -i "${{ steps.live.outputs.live_id }}"
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}
