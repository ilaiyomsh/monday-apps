name: Deploy LIVE - deadline-confirm

# Spec section 7.2: merges into main auto-deploy to the app's LATEST LIVE
# version via --force. This rebuilds from main and pushes straight to
# production — there is no promote-the-tested-draft step. Correctness is
# guaranteed only by the release-freeze rule (nothing merges into develop
# while a develop->main PR is open), not by artifact identity.
#
# main is protected (Gate 2: PR + 1 approval + required status checks +
# no bypass, including admins) so this workflow only ever runs after a
# reviewed, approved merge — never on a direct push.
#
# When instantiating this template for a real app, rename the file to:
#   deploy-live-deadline-confirm.yml
# and replace all deadline-confirm / . / APP_DEADLINE_CONFIRM_ID placeholders.

on:
  push:
    branches:
      - main
    paths:
      - "apps/deadline-confirm/**"
      - "packages/shared/**"

jobs:
  deploy-live:
    name: "🚨 FORCE DEPLOY deadline-confirm TO LIVE 🚨"
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-live-deadline-confirm
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build deadline-confirm
        # Axiom activation gate (error-guard remote-monitoring): the ingest token is the
        # only secret; dataset/app are literals; inert/fail-soft when the secret is unset.
        # Wires the client admin SPA's browser sink (src/client/admin/utils/axiomErrorSink.ts).
        env:
          VITE_AXIOM_DATASET: app-errors
          VITE_AXIOM_TOKEN: ${{ secrets.AXIOM_INGEST_TOKEN }}
          VITE_AXIOM_APP: deadline-confirm
        run: pnpm --filter "./apps/deadline-confirm" build
        env:
          VITE_AXIOM_DATASET: app-errors
          VITE_AXIOM_TOKEN: ${{ secrets.AXIOM_INGEST_TOKEN }}
          VITE_AXIOM_APP: deadline-confirm-admin
          VITE_IS_RELEASE: "true"

      # The admin CLIENT bundle ('hidden' sourcemaps) is served to browsers, so its
      # maps must NEVER reach the deploy — archive them keyed by commit SHA, then
      # strip them from public/admin before code:push. (Server runs from source and
      # is already readable — not symbolicated.) Pull with:
      #   .claude/skills/axiom-sre/scripts/symbolicate '<frame>' --app deadline-confirm --ver <x.y.z+sha>
      - name: Archive client sourcemaps as build artifact (for stack symbolication)
        uses: actions/upload-artifact@v4
        with:
          name: sourcemaps-deadline-confirm-${{ github.sha }}
          path: apps/deadline-confirm/public/admin/**/*.map
          retention-days: 90
          if-no-files-found: warn

      - name: Strip client sourcemaps before deploy (never ship .map to the browser)
        run: |
          set -euo pipefail
          find apps/deadline-confirm/public/admin -name '*.map' -type f -delete
          remaining="$(find apps/deadline-confirm/public/admin -name '*.map' -type f | wc -l | tr -d ' ')"
          echo "remaining client .map files: $remaining"
          if [ "$remaining" != "0" ]; then
            echo "::error::client sourcemaps still present — refusing to push (would leak source)"
            exit 1
          fi

      - name: Install monday.com apps CLI
        run: npm install -g @mondaycom/apps-cli

      - name: Authenticate mapps CLI (non-interactive)
        run: mapps init -t "$MONDAY_TOKEN"
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}

      # `code:push --force -a <app>` resolves the app's NEWEST version (the
      # draft above live), not live — incident-verified 2026-07-15. Resolve
      # the LIVE version id and push pinned with -i.
      - name: Resolve LIVE version id (pin the target)
        id: live
        run: |
          set -euo pipefail
          LIVE_ID="$(mapps app-version:list -i "$APP_ID" 2>/dev/null \
            | awk -F'│' '$7 ~ /live/ { gsub(/[^0-9]/, "", $3); print $3; exit }')"
          if [ -z "$LIVE_ID" ]; then
            echo "::error::app $APP_ID has no LIVE version — first go-live is a deliberate promote (pipeline-model.md §4b); this workflow only refreshes an existing live version."
            exit 1
          fi
          echo "Resolved LIVE version id: $LIVE_ID"
          echo "live_id=$LIVE_ID" >> "$GITHUB_OUTPUT"
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}
          APP_ID: ${{ secrets.APP_DEADLINE_CONFIRM_ID }}

      # Server app: no -c, ships the app root. Retry once on the transient
      # "Unexpected error ... communicating with the remote server" (it failed
      # the first live run 2026-07-15 with no retry).
      - name: "🚨 FORCE push to LIVE version (pinned id) 🚨"
        run: |
          set -uo pipefail
          for attempt in 1 2; do
            if mapps code:push --force \
                 -d apps/deadline-confirm/. \
                 -i "${{ steps.live.outputs.live_id }}"; then
              exit 0
            fi
            echo "push attempt $attempt failed; retrying once in 15s (transient remote error)…"
            sleep 15
          done
          echo "::error::code:push to live version ${{ steps.live.outputs.live_id }} failed after retry"
          exit 1
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}
