name: Deploy LIVE - twyst-your-status

# round324 same-origin unification: ONE app, a SINGLE monday-code push. The
# server serves the built SPA from public/ (no CDN -c push, no guard URL).
# Spec section 7.2: merges into main auto-deploy to the app's LATEST LIVE
# version via --force. This rebuilds from main and pushes straight to
# production — there is no promote-the-tested-draft step.

on:
  push:
    branches:
      - main
    paths:
      - "apps/twyst-your-status/**"
      - "packages/shared/**"
      - "packages/error-kit/**"

jobs:
  deploy-live:
    name: "🚨 FORCE DEPLOY twyst-your-status TO LIVE 🚨"
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-live-twyst-your-status
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the SPA (client bundle)
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_IS_RELEASE: "true"
          VITE_AXIOM_DATASET: app-errors
          VITE_AXIOM_TOKEN: ${{ secrets.AXIOM_INGEST_TOKEN }}
          VITE_AXIOM_APP: twyst-your-status
        run: pnpm --filter "./apps/twyst-your-status" build

      - name: Bundle the guard server (inlines the client domain modules)
        run: pnpm --filter "./apps/twyst-your-status/server" build

      - name: Stage the SPA into the server's public/ (same-origin serving)
        run: |
          set -euo pipefail
          rm -rf apps/twyst-your-status/server/public
          mkdir -p apps/twyst-your-status/server/public
          cp -R apps/twyst-your-status/dist/. apps/twyst-your-status/server/public/

      - name: Archive SPA sourcemaps as build artifact (for stack symbolication)
        uses: actions/upload-artifact@v4
        with:
          name: sourcemaps-twyst-your-status-live-${{ github.sha }}
          path: apps/twyst-your-status/server/public/**/*.map
          retention-days: 90
          if-no-files-found: warn

      - name: Strip SPA sourcemaps before deploy (never serve .map to browsers)
        run: |
          set -euo pipefail
          find apps/twyst-your-status/server/public -name '*.map' -type f -delete
          remaining="$(find apps/twyst-your-status/server/public -name '*.map' -type f | wc -l | tr -d ' ')"
          echo "remaining .map files in server/public: $remaining"
          if [ "$remaining" != "0" ]; then
            echo "::error::sourcemaps still present in server/public — refusing to push (would serve source to browsers)"
            exit 1
          fi

      - name: Install monday.com apps CLI
        run: npm install -g @mondaycom/apps-cli

      - name: Authenticate mapps CLI (non-interactive)
        run: mapps init -t "$MONDAY_TOKEN"
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN_TWYST_YOUR_STATUS }}

      # PIN the live version. `code:push -a` (with or without --force) resolves
      # the LATEST version — normally the DRAFT — so `--force -a` would silently
      # refresh the draft and leave production untouched (pipeline-model.md §4).
      - name: Resolve LIVE version id (pin the target)
        id: live
        run: |
          set -euo pipefail
          LIVE_ID="$(mapps app-version:list -i "$APP_ID" 2>/dev/null \
            | awk -F'│' '$7 ~ /live/ { gsub(/[^0-9]/, "", $3); print $3; exit }')"
          if [ -z "$LIVE_ID" ]; then
            echo "::error::app $APP_ID has no LIVE version — first go-live is a deliberate promote (pipeline-model.md §4b); this workflow only refreshes an existing live version."
            exit 1
          fi
          echo "Resolved LIVE version id: $LIVE_ID"
          echo "live_id=$LIVE_ID" >> "$GITHUB_OUTPUT"
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN_TWYST_YOUR_STATUS }}
          APP_ID: ${{ secrets.APP_TWYST_YOUR_STATUS_ID }}

      # Server-side push: no -c flag; --force refreshes the PINNED live version.
      # --verbose is LOAD-BEARING (mapps cli.md): a failed server push is
      # otherwise silent. The archive carries dist/index.js AND public/ (SPA).
      - name: "🚨 FORCE push to LIVE version (pinned id) 🚨"
        run: >
          mapps code:push
          -d apps/twyst-your-status/server
          -i "${{ steps.live.outputs.live_id }}"
          --force
          --verbose
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN_TWYST_YOUR_STATUS }}
          APP_ID: ${{ secrets.APP_TWYST_YOUR_STATUS_ID }}
