name: Deploy LIVE - twyst-your-status

# Spec section 7.2: merges into main auto-deploy to the app's LATEST LIVE
# version via --force. This rebuilds from main and pushes straight to
# production — there is no promote-the-tested-draft step. Correctness is
# guaranteed only by the release-freeze rule (nothing merges into develop
# while a develop->main PR is open), not by artifact identity.
#
# main is protected (Gate 2: PR + 1 approval + required status checks +
# no bypass, including admins) so this workflow only ever runs after a
# reviewed, approved merge — never on a direct push.
#
# When instantiating this template for a real app, rename the file to:
#   deploy-live-twyst-your-status.yml
# and replace all twyst-your-status / dist / APP_TWYST_YOUR_STATUS_ID placeholders.

on:
  push:
    branches:
      - main
    paths:
      - "apps/twyst-your-status/**"
      - "packages/shared/**"

jobs:
  deploy-live:
    name: "🚨 FORCE DEPLOY twyst-your-status TO LIVE 🚨"
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-live-twyst-your-status
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build twyst-your-status
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_IS_RELEASE: "true"
        run: pnpm --filter "./apps/twyst-your-status" build

      - name: Install monday.com apps CLI
        run: npm install -g @mondaycom/apps-cli

      - name: Authenticate mapps CLI (non-interactive)
        run: mapps init -t "$MONDAY_TOKEN"
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}

      # `code:push --force -a <app>` is NOT reliable for live: it resolves the
      # app's NEWEST version (usually the newer draft sitting above live), not
      # the live version — incident-verified on deadline-confirm 2026-07-15
      # (a bare --force push landed on the draft and left live untouched). So
      # resolve the LIVE version id at run time and push pinned with -i.
      - name: Resolve LIVE version id (pin the target)
        id: live
        run: |
          set -euo pipefail
          LIVE_ID="$(mapps app-version:list -i "$APP_ID" 2>/dev/null \
            | awk -F'│' '$7 ~ /live/ { gsub(/[^0-9]/, "", $3); print $3; exit }')"
          if [ -z "$LIVE_ID" ]; then
            echo "::error::app $APP_ID has no LIVE version — first go-live is a deliberate promote (pipeline-model.md §4b); this workflow only refreshes an existing live version."
            exit 1
          fi
          echo "Resolved LIVE version id: $LIVE_ID"
          echo "live_id=$LIVE_ID" >> "$GITHUB_OUTPUT"
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}
          APP_ID: ${{ secrets.APP_TWYST_YOUR_STATUS_ID }}

      # -c is "-c" for client-side (CDN) apps, empty for
      # server-side (monday-code) apps — the only difference between the two.
      # Retry once on the transient "Unexpected error ... communicating with
      # the remote server" (same guard ship.sh has; it failed a live run
      # 2026-07-15 with no retry).
      - name: "🚨 FORCE push to LIVE version (pinned id) 🚨"
        run: |
          set -uo pipefail
          for attempt in 1 2; do
            if mapps code:push --force \
                 -d apps/twyst-your-status/. \
                 -i "${{ steps.live.outputs.live_id }}"; then
              exit 0
            fi
            echo "push attempt $attempt failed; retrying once in 15s (transient remote error)…"
            sleep 15
          done
          echo "::error::code:push to live version ${{ steps.live.outputs.live_id }} failed after retry"
          exit 1
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}
