name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Vitest (TZ=${{ matrix.tz }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tz:
          - Asia/Jerusalem
          - UTC
          - America/New_York
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test:run

      # ESLint gate — threshold re-pinned to the actual current known-debt count: 42
      # warnings (38 `react-hooks/exhaustive-deps` + 4 `no-unused-vars`). This debt is
      # pre-existing and OUTSIDE the error-handling initiative's scope; the error-handling
      # work does not touch these warnings, it only keeps the gate green so new rules can be
      # layered on a passing tree (see error-handling-implementation-plan.md, "Phase −1").
      # New warnings beyond 42 fail CI; the catalogued ones do not. The exhaustive-deps debt
      # is expected to ratchet down as god-files are dismantled in later waves.
      - name: Lint
        if: matrix.tz == 'Asia/Jerusalem'
        run: pnpm exec eslint src/ --ext .js,.jsx --max-warnings 42
