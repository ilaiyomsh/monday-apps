mutation UpdatePaymentModel {
  update_status_column(
    board_id: <BOARD_ID>
    id: "status_mkn7tn68"
    revision: "7c4813aa99deab05a709e09a965d93f1"
    title: "מודל תשלומים"
    settings: {
      labels: [
        { index: 0, label: "בנק",                  color: working_orange }
        { index: 1, label: "פיקס",                 color: done_green, is_done: true }
        { index: 2, label: "ליווי חודשי - נמוך",   color: bubble }
        { index: 3, label: "לא לחיוב",             color: dark_blue }
        { index: 4, label: "עמלות",                color: purple }
        { index: 6, label: "ליווי חודשי - גבוה",   color: blackish }
        { index: 7, label: "שעות גמיש",            color: egg_yolk }
        { index: 8, label: "ליווי חודשי - בינוני", color: sofia_pink }
      ]
    }
  ) {
    id
    title
    settings_str
  }
}

