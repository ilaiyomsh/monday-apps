<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>אייקונים לאפליקציית דיונים — קונספטים יצירתיים</title>
<style>
  :root {
    --bg:#ffffff; --icon:#323338; --text:#323338; --muted:#676879;
    --border:#e6e9ef; --hover:#f5f6f8;
  }
  * { box-sizing:border-box; }
  body{
    margin:0; font-family:"Figtree","Segoe UI",Roboto,system-ui,-apple-system,sans-serif;
    background:var(--bg); color:var(--text); padding:40px 24px 80px;
  }
  header{ max-width:1100px; margin:0 auto 36px; text-align:center; }
  h1{ font-size:24px; margin:0 0 8px; font-weight:700; }
  header p{ color:var(--muted); margin:0; font-size:15px; }

  .grid{
    max-width:1100px; margin:0 auto; display:grid;
    grid-template-columns:repeat(auto-fill,minmax(235px,1fr)); gap:16px;
  }
  .cell{
    border:1px solid var(--border); border-radius:12px; padding:22px 18px 16px;
    display:flex; flex-direction:column; align-items:center; gap:16px;
    transition:background .15s ease;
  }
  .cell:hover{ background:var(--hover); }

  .row{ width:100%; display:flex; align-items:center; gap:10px; direction:rtl; font-size:15px; }
  .row .glyph{ color:var(--icon); flex:0 0 auto; }

  .sizes{ display:flex; align-items:center; gap:16px; }
  .sizes svg{ color:var(--icon); display:block; }
  .ico-lg{ width:44px; height:44px; } .ico-md{ width:24px; height:24px; } .ico-sm{ width:18px; height:18px; }

  .label{ font-size:13px; color:var(--muted); text-align:center; }
  .label b{ display:block; color:var(--text); font-size:13px; margin-bottom:2px; }

  svg.line{ fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
</style>
</head>
<body>
<header>
  <h1>אייקונים לאפליקציית דיונים — קונספטים</h1>
  <p>12 מטאפורות שונות לדיון, בקו monday נקי. כל אחד מוצג כשורת תפריט וב‑3 גדלים (44 / 24 / 18).</p>
</header>

<div class="grid" id="grid"></div>

<script>
const icons = [
  {
    name:"שולחן עגול",
    desc:"מושבים סביב שולחן — ישיבת דיון",
    svg:`<circle cx="12" cy="12" r="3.4"/>
         <circle cx="12" cy="4.6" r="1.5"/><circle cx="12" cy="19.4" r="1.5"/>
         <circle cx="4.6" cy="12" r="1.5"/><circle cx="19.4" cy="12" r="1.5"/>
         <circle cx="6.9" cy="6.9" r="1.5"/><circle cx="17.1" cy="17.1" r="1.5"/>
         <circle cx="17.1" cy="6.9" r="1.5"/><circle cx="6.9" cy="17.1" r="1.5"/>`
  },
  {
    name:"החלפת דעות",
    desc:"שני חיצים — דו־כיווניות הדיון",
    svg:`<path d="M4 8.5h11l-2.6-2.6M4 8.5l2.6 2.6"/>
         <path d="M20 15.5H9l2.6 2.6M20 15.5l-2.6-2.6"/>`
  },
  {
    name:"גלי קול",
    desc:"בועה עם גל דיבור — קולות",
    svg:`<path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-7l-4 3v-3H6a2 2 0 0 1-2-2V6Z"/>
         <path d="M7.5 11V9M10 12V8M12.5 13V7M15 12V8M17.5 11V9"/>`
  },
  {
    name:"הצבעה / יד מורמת",
    desc:"מבקש רשות דיבור",
    svg:`<path d="M10 13V6.5a1.3 1.3 0 0 1 2.6 0V12"/>
         <path d="M12.6 11.5v-1a1.2 1.2 0 0 1 2.4 0v3.5a4.5 4.5 0 0 1-4.5 4.5h-1a3 3 0 0 1-2.6-1.5l-1.6-2.7a1.2 1.2 0 0 1 2-1.3l1.2 1.3V8.7a1.2 1.2 0 0 1 2.4 0V12"/>`
  },
  {
    name:"הסכמה / חפיפה",
    desc:"שני מעגלים חופפים עם וי",
    svg:`<circle cx="9" cy="12" r="5.5"/><circle cx="15" cy="12" r="5.5"/>
         <path d="M10.4 12.2l1.4 1.4 2.4-2.6"/>`
  },
  {
    name:"שרשור / נושאים",
    desc:"דיון מתפצל לנושאים ומשימות",
    svg:`<circle cx="5.5" cy="12" r="2"/>
         <circle cx="18.5" cy="6" r="1.8"/><circle cx="18.5" cy="12" r="1.8"/><circle cx="18.5" cy="18" r="1.8"/>
         <path d="M7.5 11.4 16.7 6.6M7.5 12h9M7.5 12.6 16.7 17.4"/>`
  },
  {
    name:"רעיון",
    desc:"בועת שיחה כנורת רעיון",
    svg:`<path d="M16.5 9.5a4.5 4.5 0 1 0-7.2 3.6c.6.5 1 1.2 1 2v.4h4.4v-.4c0-.8.4-1.5 1-2a4.5 4.5 0 0 0 .8-3.6Z"/>
         <path d="M10.3 18h3.4M11 20h2"/>`
  },
  {
    name:"החלטה / פטיש",
    desc:"דיון שמסתיים בהכרעה",
    svg:`<path d="M13.5 4.5l4 4M11.5 6.5l4 4"/>
         <path d="M12.5 7.5 7 13a1.4 1.4 0 0 0 2 2l5.5-5.5"/>
         <path d="M6 19.5h7"/>`
  },
  {
    name:"סדר יום",
    desc:"בועה עם צ'קליסט מתקדם",
    svg:`<path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-7l-4 3v-3H6a2 2 0 0 1-2-2V6Z"/>
         <path d="M6.6 7.6l.9.9L9 6.9"/><path d="M11 8h6"/>
         <path d="M6.8 11.5h.9"/><path d="M11 11.8h6"/>`
  },
  {
    name:"זרקור / נקודה לדיון",
    desc:"מעגלים מתרחבים סביב נקודה",
    svg:`<circle cx="12" cy="14" r="1.6" fill="currentColor" stroke="none"/>
         <path d="M8.8 11.2a4.5 4.5 0 0 1 6.4 0"/>
         <path d="M6.5 8.9a7.8 7.8 0 0 1 11 0"/>`
  },
  {
    name:"דיו־לוג",
    desc:"שתי בועות שזורות — אינסוף שיחה",
    svg:`<path d="M11 8.5A4 4 0 1 0 11 15.5"/>
         <path d="M13 15.5A4 4 0 1 0 13 8.5"/>
         <path d="M8 16l-2.5 2v-2.4"/>
         <path d="M16 8l2.5-2v2.4"/>`
  },
  {
    name:"דיון פתוח → סגור",
    desc:"בועה שהזנב שלה הוא חץ קדימה",
    svg:`<path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h9A2.5 2.5 0 0 1 18 6.5v5A2.5 2.5 0 0 1 15.5 14H9"/>
         <path d="M9 14v3l-3.5-3"/>
         <path d="M13.5 17.5h6m0 0-2.4-2.4M19.5 17.5l-2.4 2.4"/>`
  },
];

const grid=document.getElementById("grid");
icons.forEach((ic,i)=>{
  const cell=document.createElement("div"); cell.className="cell";
  const svg=(cls)=>`<svg class="line ${cls}" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">${ic.svg}</svg>`;
  cell.innerHTML=`
    <div class="row"><span class="glyph">${svg("ico-md")}</span><span>${ic.name}</span></div>
    <div class="sizes">${svg("ico-lg")}${svg("ico-md")}${svg("ico-sm")}</div>
    <div class="label"><b>${String(i+1).padStart(2,"0")} · ${ic.name}</b>${ic.desc}</div>`;
  grid.appendChild(cell);
});
</script>
</body>
</html>
